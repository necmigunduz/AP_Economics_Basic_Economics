<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AP Economics — PPC, Trade & Opportunity Cost Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--surface:#f6f8fa;--card:#ffffff;--border:#d0d7de;
  --accent:#953a00;--accent2:#0969da;--green:#1a7f37;--red:#cf222e;
  --purple:#6639ba;--text:#1f2328;--muted:#636c76;--label:#24292f;
  --teal:#0969da;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Lora',Georgia,serif;min-height:100vh;}

/* ── Header ── */
header{
  background:linear-gradient(160deg,#f0f4ff 0%,#ffffff 60%,#f0f4ff 100%);
  border-bottom:1px solid var(--border);
  padding:3rem 2rem 2.5rem;text-align:center;position:relative;overflow:hidden;
}
header::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 70% 60% at 50% 0%,rgba(149,58,0,0.06),transparent);
  pointer-events:none;
}
.hdr-eyebrow{
  display:inline-flex;align-items:center;gap:0.5rem;
  font-size:0.7rem;letter-spacing:0.22em;text-transform:uppercase;
  color:var(--accent);margin-bottom:1rem;
  border:1px solid rgba(149,58,0,0.25);border-radius:99px;
  padding:0.25rem 1rem;background:rgba(149,58,0,0.06);
}
header h1{
  font-family:'Playfair Display',serif;font-size:clamp(2rem,5vw,3.4rem);
  font-weight:800;color:var(--text);letter-spacing:-0.02em;line-height:1.1;
}
header h1 em{color:var(--accent);font-style:normal;}
.hdr-sub{margin-top:0.8rem;color:var(--muted);font-size:0.9rem;letter-spacing:0.04em;}
.hdr-pills{display:flex;justify-content:center;gap:0.6rem;margin-top:1.2rem;flex-wrap:wrap;}
.hdr-pill{
  font-size:0.74rem;color:var(--label);
  background:var(--surface);border:1px solid var(--border);
  border-radius:99px;padding:0.25rem 0.85rem;
}

/* ── Progress ── */
.progress-wrap{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:0.85rem 2rem;display:flex;align-items:center;gap:1.2rem;
  position:sticky;top:0;z-index:100;
}
.progress-bar{flex:1;height:4px;background:var(--border);border-radius:99px;overflow:hidden;}
.progress-fill{
  height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));
  border-radius:99px;transition:width 0.5s ease;width:0%;
}
.progress-text{font-size:0.8rem;color:var(--muted);white-space:nowrap;min-width:90px;text-align:right;}
.score-pill{
  font-size:0.8rem;font-weight:600;color:var(--accent);
  background:rgba(240,165,0,0.10);border:1px solid rgba(240,165,0,0.25);
  border-radius:99px;padding:0.2rem 0.85rem;white-space:nowrap;
}

/* ── Main layout ── */
main{max-width:960px;margin:0 auto;padding:2.5rem 1.5rem 5rem;display:flex;flex-direction:column;gap:1.8rem;}

/* ── Section divider ── */
.section-div{
  display:flex;align-items:center;gap:1rem;
  padding:0.8rem 0 0.2rem;border-bottom:1px solid var(--border);
}
.section-div h2{
  font-family:'Playfair Display',serif;font-size:1.35rem;font-weight:700;
  color:var(--accent);white-space:nowrap;
}
.section-div p{font-size:0.85rem;color:var(--muted);}

/* ── MC Card ── */
.q-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:14px;overflow:hidden;transition:border-color 0.35s;
}
.q-card.answered-correct{border-color:var(--green);}
.q-card.answered-wrong{border-color:var(--red);}

.q-header{
  display:flex;align-items:center;gap:0.9rem;
  padding:0.9rem 1.4rem;border-bottom:1px solid var(--border);
  background:rgba(255,255,255,0.015);
}
.q-num{
  font-family:'Playfair Display',serif;font-size:0.95rem;font-weight:700;
  color:var(--accent);min-width:2.2rem;
}
.q-badge{
  font-size:0.68rem;text-transform:uppercase;letter-spacing:0.15em;
  color:var(--muted);background:var(--surface);border:1px solid var(--border);
  border-radius:99px;padding:0.16rem 0.65rem;
}
.q-status{margin-left:auto;font-size:1rem;opacity:0;transition:opacity 0.3s;}
.q-card.answered-correct .q-status,.q-card.answered-wrong .q-status{opacity:1;}

.q-graph{padding:1.1rem 1.4rem 0;}
.q-graph img{width:100%;border-radius:9px;border:1px solid var(--border);display:block;}

.q-body{padding:1.1rem 1.4rem 0.7rem;}
.q-stem{font-size:0.95rem;color:var(--text);line-height:1.65;margin-bottom:0.7rem;font-style:italic;}
.q-question{font-size:1.02rem;font-weight:500;color:var(--text);line-height:1.55;}

.choices{padding:0.35rem 1.4rem 1.3rem;display:flex;flex-direction:column;gap:0.45rem;}
.choice{
  display:flex;align-items:flex-start;gap:0.85rem;
  padding:0.7rem 1rem;border-radius:9px;
  border:1px solid var(--border);background:var(--surface);
  cursor:pointer;transition:background 0.15s,border-color 0.15s,transform 0.1s;
  font-size:0.93rem;line-height:1.5;color:var(--label);user-select:none;
}
.choice:hover:not(.disabled){
  background:rgba(56,139,253,0.09);border-color:var(--accent2);
  color:var(--text);transform:translateX(3px);
}
.choice-letter{
  font-family:'Playfair Display',serif;font-weight:700;font-size:0.85rem;
  color:var(--accent2);min-width:1.2rem;padding-top:0.05rem;flex-shrink:0;
}
.choice.correct{background:rgba(63,185,80,0.11);border-color:var(--green);color:var(--text);}
.choice.correct .choice-letter{color:var(--green);}
.choice.wrong{background:rgba(248,81,73,0.11);border-color:var(--red);color:var(--text);}
.choice.wrong .choice-letter{color:var(--red);}
.choice.disabled{cursor:default;pointer-events:none;}
.choice.reveal-correct{background:rgba(63,185,80,0.06);border-color:rgba(63,185,80,0.35);color:var(--muted);}

.explanation{
  margin:0 1.4rem 1.3rem;padding:0.85rem 1rem;border-radius:9px;
  border-left:3px solid var(--green);background:rgba(63,185,80,0.06);
  font-size:0.88rem;color:var(--label);line-height:1.65;display:none;
}
.explanation.wrong-exp{border-color:var(--red);background:rgba(248,81,73,0.06);}
.explanation strong{color:var(--text);}

/* ── FR Card ── */
.fr-card{background:var(--card);border:2px solid rgba(188,140,255,0.45);border-radius:14px;overflow:hidden;}
.fr-header{
  padding:1rem 1.4rem;border-bottom:1px solid var(--border);
  background:rgba(188,140,255,0.05);display:flex;align-items:center;gap:0.8rem;flex-wrap:wrap;
}
.fr-header h3{font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;color:var(--purple);}
.fr-badge{
  font-size:0.68rem;text-transform:uppercase;letter-spacing:0.14em;
  color:var(--purple);background:rgba(188,140,255,0.10);
  border:1px solid rgba(188,140,255,0.28);border-radius:99px;padding:0.16rem 0.65rem;
}
.fr-graph{padding:1.1rem 1.4rem 0;}
.fr-graph img{width:100%;border-radius:9px;border:1px solid var(--border);display:block;margin-bottom:0.7rem;}
.fr-body{padding:1rem 1.4rem;}
.fr-context{font-size:0.95rem;color:var(--text);line-height:1.65;margin-bottom:1rem;font-style:italic;}
.fr-table{width:100%;border-collapse:collapse;margin-bottom:1.1rem;font-size:0.9rem;}
.fr-table th{background:rgba(188,140,255,0.12);color:var(--purple);padding:0.48rem 0.8rem;text-align:center;border:1px solid var(--border);font-weight:600;letter-spacing:0.02em;}
.fr-table td{padding:0.42rem 0.8rem;text-align:center;border:1px solid var(--border);color:var(--label);}

.fr-parts{display:flex;flex-direction:column;gap:0.75rem;padding:0 1.4rem 1.4rem;}
.fr-part{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:0.85rem 1rem;}
.fr-part-label{font-family:'Playfair Display',serif;font-weight:700;color:var(--purple);font-size:0.93rem;margin-bottom:0.3rem;}
.fr-part-q{font-size:0.94rem;color:var(--text);line-height:1.62;white-space:pre-line;}
.fr-answer{
  margin-top:0.55rem;padding:0.7rem 0.95rem;
  background:rgba(63,185,80,0.07);border-left:3px solid var(--green);
  border-radius:0 8px 8px 0;font-size:0.88rem;color:var(--label);
  line-height:1.65;display:none;
}
.fr-answer strong{color:var(--text);}
.show-answer-btn{
  margin-top:0.5rem;padding:0.3rem 0.95rem;border-radius:99px;
  border:1px solid rgba(63,185,80,0.45);background:transparent;
  color:var(--green);font-family:'Lora',serif;font-size:0.8rem;
  cursor:pointer;transition:background 0.15s;
}
.show-answer-btn:hover{background:rgba(63,185,80,0.1);}

/* ── Results ── */
#results{
  display:none;background:var(--surface);
  border:1px solid var(--border);border-radius:14px;padding:2.5rem;text-align:center;
}
#results h2{font-family:'Playfair Display',serif;font-size:1.9rem;color:var(--accent);margin-bottom:0.4rem;}
.score-big{font-size:3.8rem;font-family:'Playfair Display',serif;font-weight:800;color:var(--text);line-height:1;margin:0.7rem 0;}
#results p{color:var(--muted);font-size:0.95rem;margin-bottom:0.25rem;}
.btn-reset{
  margin-top:1.3rem;padding:0.75rem 2.2rem;border-radius:99px;border:none;
  background:linear-gradient(135deg,var(--accent2),var(--accent));
  color:#fff;font-family:'Lora',serif;font-size:0.95rem;font-weight:500;
  cursor:pointer;transition:opacity 0.2s,transform 0.15s;
}
.btn-reset:hover{opacity:0.88;transform:translateY(-2px);}
</style>
</head>
<body>

<header>
  <div class="hdr-eyebrow">AP Economics</div>
  <h1>Production Possibilities,<br><em>Trade &amp; Opportunity Cost</em></h1>
  <div class="hdr-sub">Based on Krugman &amp; Wells · Chapters 2–3</div>
  <div class="hdr-pills">
    <span class="hdr-pill">15 Multiple Choice</span>
    <span class="hdr-pill">5 Free Response</span>
    <span class="hdr-pill">PPC Analysis</span>
    <span class="hdr-pill">Comparative Advantage</span>
    <span class="hdr-pill">Positive vs. Normative</span>
  </div>
</header>

<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-text" id="progressText">MC: 0 / 15</div>
  <div class="score-pill" id="scorePill">Score: 0</div>
</div>

<main id="quizMain"></main>

const MC = [{"num": 1, "graph": null, "stem": "A textile company produces pants and shirts using sewing machines, cotton fabric, factory workers, and a business owner who organizes production.", "question": "Which of the following correctly classifies these inputs into the four factors of production?", "choices": ["Machines = land; fabric = capital; workers = entrepreneurship; owner = labor", "Machines = capital; fabric = land; workers = labor; owner = entrepreneurship", "Machines = labor; fabric = land; workers = capital; owner = entrepreneurship", "Machines = capital; fabric = entrepreneurship; workers = land; owner = labor", "Machines = entrepreneurship; fabric = capital; workers = labor; owner = land"], "answer": 1, "explanation": "Fabric comes from nature (land/natural resources). Machines are manufactured tools (capital). Workers provide human effort (labor). The owner who organizes production is the entrepreneur (entrepreneurship). Answer: B."}, {"num": 2, "graph": null, "stem": "A student who earns $15/hour working part-time decides to attend a free economics lecture for two hours instead of working.", "question": "What is the opportunity cost of attending the lecture?", "choices": ["$0, because the lecture is free", "$15, because that is one hour of forgone wages", "$30, because that is two hours of forgone wages", "The cost of the student's textbooks", "The enjoyment the student gets from the lecture"], "answer": 2, "explanation": "Opportunity cost = value of the best forgone alternative. The student gives up 2 hours \u00d7 $15 = $30 in wages. The lecture being free is irrelevant \u2014 time has an opportunity cost. Answer: C."}, {"num": 3, "graph": "eq2_mc_atlantis.png", "stem": "The PPC above shows Atlantis's annual trade-off between potatoes (horizontal axis) and fish (vertical axis). Points A\u2013F lie on the curve. Point P (800 potatoes, 500 fish) is marked with an \u00d7.", "question": "What does point P represent, and what is the opportunity cost of moving from point C (600 potatoes, 500 fish) to point B (800 potatoes, 300 fish)?", "choices": ["P is efficient; opportunity cost of 200 more potatoes is 300 fish", "P is infeasible; opportunity cost of 200 more potatoes is 200 fish", "P is infeasible with current resources; opportunity cost of moving C\u2192B is 200 fish", "P is inside the PPC; opportunity cost of moving C\u2192B is 500 fish", "P is on the PPC; opportunity cost cannot be determined from the graph"], "answer": 2, "explanation": "Point P lies outside the current PPC \u2014 Atlantis cannot currently produce that combination. Moving from C (600 potatoes, 500 fish) to B (800 potatoes, 300 fish) sacrifices 200 pounds of fish to gain 200 pounds of potatoes. Answer: C."}, {"num": 4, "graph": null, "stem": "On the island of Tropica, moving from 300 to 400 coconuts per year requires giving up 30 fish. Moving from 400 to 500 coconuts requires giving up 55 fish. Moving from 500 to 600 coconuts requires giving up 90 fish.", "question": "Which of the following correctly describes Tropica's production possibilities curve and the principle it illustrates?", "choices": ["The PPC is a straight line; opportunity costs are constant", "The PPC bows inward; resources become more specialized as production shifts", "The PPC bows outward; opportunity costs increase as more coconuts are produced", "The PPC shifts outward; Tropica is experiencing economic growth", "The PPC is vertical; coconuts and fish cannot be traded off"], "answer": 2, "explanation": "Each additional 100 coconuts costs more and more fish (30, then 55, then 90) \u2014 increasing opportunity costs. This produces a PPC that is bowed outward (concave to the origin), reflecting the law of increasing opportunity costs. Answer: C."}, {"num": 5, "graph": "eq2_mc_bermuda.png", "stem": "The PPC above shows Bermuda's trade-off between fish and hotel stays. The opportunity cost of one additional metric ton of fish is 2,000 hotel stays (constant). Bermuda's actual 2000 production point is marked.", "question": "If Bermuda's 307 fishermen all moved to hotel work, approximately how many total hotel stays could Bermuda produce?", "choices": ["538,000 hotel stays", "572,000 hotel stays", "1,110,000 hotel stays", "286,000 hotel stays", "824,000 hotel stays"], "answer": 2, "explanation": "Current hotel stays = 538,000. If 307 fishermen join hotels, they could have produced 286 tons \u00d7 2,000 = 572,000 additional hotel stays. Total = 538,000 + 572,000 = 1,110,000. This is the y-intercept of the PPC. Answer: C."}, {"num": 6, "graph": null, "stem": "Country Alpha can produce a maximum of 60 units of cloth OR 40 units of food. Country Beta can produce a maximum of 30 units of cloth OR 45 units of food. Both PPCs are straight lines.", "question": "Which country has the comparative advantage in food production, and what is its opportunity cost of one unit of food?", "choices": ["Alpha; 1.5 units of cloth per unit of food", "Beta; 0.67 units of cloth per unit of food", "Alpha; 0.67 units of cloth per unit of food", "Beta; 1.5 units of cloth per unit of food", "Alpha; 2 units of cloth per unit of food"], "answer": 1, "explanation": "Alpha: 1 food costs 60/40 = 1.5 cloth. Beta: 1 food costs 30/45 = 0.67 cloth. Beta has the lower opportunity cost for food \u2192 comparative advantage in food. Its opportunity cost = 0.67 cloth per food. Answer: B."}, {"num": 7, "graph": null, "stem": "'Workers in developing countries earn only a fraction of what U.S. workers earn. Therefore, the United States cannot benefit from trading with developing countries, since U.S. workers are more expensive.'", "question": "Which of the following best evaluates this claim?", "choices": ["The claim is correct \u2014 high wages make U.S. exports uncompetitive in all industries", "The claim is correct \u2014 trade only benefits countries with low wages", "The claim is incorrect \u2014 comparative advantage, not wage levels, determines gains from trade", "The claim is correct \u2014 absolute advantage determines all trade patterns", "The claim is incorrect \u2014 trade is determined solely by absolute advantage"], "answer": 2, "explanation": "Trade is determined by comparative advantage \u2014 relative opportunity costs \u2014 not absolute wage levels or productivity. Even if one country is more productive overall, both countries can gain from specializing in goods where they have a comparative advantage. Answer: C."}, {"num": 8, "graph": "eq2_mc_roma.png", "stem": "The diagrams above show the monthly PPCs for the Tivoli (30 spaghetti OR 50 meatballs) and the Frivoli before and after their meatball innovation (original: 40 spaghetti OR 30 meatballs; new: 40 spaghetti OR 60 meatballs).", "question": "After the Frivoli's innovation, which tribe has the comparative advantage in spaghetti, and which has the absolute advantage in meatballs?", "choices": ["Tivoli: comparative advantage in spaghetti; Frivoli: absolute advantage in meatballs", "Frivoli: comparative advantage in spaghetti; Tivoli: absolute advantage in meatballs", "Tivoli: comparative advantage in both; Frivoli: absolute advantage in both", "Frivoli: comparative advantage in spaghetti; Frivoli: absolute advantage in meatballs", "Tivoli: absolute advantage in spaghetti; Frivoli: comparative advantage in meatballs"], "answer": 0, "explanation": "After innovation: Frivoli can make 60 meatballs OR 40 spaghetti \u2192 absolute advantage in meatballs (60 > 50). Opportunity cost of spaghetti: Tivoli = 50/30 = 1.67 meatballs; Frivoli = 60/40 = 1.5 meatballs. Frivoli has lower OC for spaghetti... but Tivoli: 1 spaghetti = 50/30=1.67 mb vs Frivoli 60/40=1.5 mb, so Frivoli has comp advantage in spaghetti. Wait \u2014 re-check: Tivoli OC of 1 meatball = 30/50=0.6 spaghetti. Frivoli OC of 1 meatball = 40/60=0.67 spaghetti. Tivoli has lower OC for meatballs \u2192 comparative advantage in meatballs. Frivoli: lower OC for spaghetti. Absolute advantage meatballs: Frivoli (60>50). Answer: A."}, {"num": 9, "graph": "eq2_mc_wheancorn.png", "stem": "The PPC above shows U.S. wheat and corn production. The original efficient point is (2.158 bn bushels wheat, 11.807 bn bushels corn). The opportunity cost at that point is 1.7 bushels of corn per bushel of wheat, and opportunity costs are increasing.", "question": "Point (b) on the graph shows farmers transferring land to produce 3.158 billion bushels of wheat and 10.107 billion bushels of corn. How should this point be classified?", "choices": ["Feasible and efficient in production", "Feasible but not efficient in production", "Not feasible", "Uncertain as to whether it is feasible", "It lies inside the PPC"], "answer": 2, "explanation": "Moving from the original point, increasing wheat by 1 billion bushels would require giving up more than 1.7 bn corn (increasing opportunity costs). Giving up only 1.7 bn corn (11.807\u221210.107=1.7) is not enough at increasing costs \u2014 you'd need to give up MORE than 1.7. So producing 3.158 wheat AND 10.107 corn is not feasible. Answer: C."}, {"num": 10, "graph": null, "stem": "The United States exports large quantities of commercial aircraft to China and imports large quantities of clothing from China.", "question": "Which of the following conclusions is best supported by this trade pattern?", "choices": ["The U.S. has an absolute advantage in both aircraft and clothing", "China has an absolute advantage in both aircraft and clothing", "The U.S. has a comparative advantage in aircraft; China has a comparative advantage in clothing", "China has a comparative advantage in aircraft; the U.S. has a comparative advantage in clothing", "Both countries have equal comparative advantage in both goods"], "answer": 2, "explanation": "Countries export goods in which they have comparative advantage. The U.S. exports aircraft \u2192 comparative advantage in aircraft. China exports clothing \u2192 comparative advantage in clothing. Absolute advantage cannot be determined from trade data alone. Answer: C."}, {"num": 11, "graph": null, "stem": "Peter Pundit claims: 'The EU's productivity is growing so fast it will soon exceed U.S. productivity in all industries, meaning the U.S. will no longer benefit from trade with the EU.'", "question": "Which of the following best explains the flaw in Peter Pundit's reasoning?", "choices": ["He is correct \u2014 if the EU outproduces the U.S. in all goods, trade will cease", "He is wrong \u2014 the EU already has absolute advantage over the U.S. in all industries", "He confuses absolute and comparative advantage; trade is based on relative opportunity costs, which always exist between two countries", "He is correct \u2014 absolute advantage always determines trade patterns", "He is wrong because productivity improvements always harm trading partners"], "answer": 2, "explanation": "Even if the EU gains absolute advantage in all industries, comparative advantage \u2014 based on relative opportunity costs \u2014 always exists between countries. As long as relative costs differ, both countries gain from specialization and trade. Pundit confuses absolute advantage with comparative advantage. Answer: C."}, {"num": 12, "graph": null, "stem": "'Raising import tariffs on foreign steel reduces domestic steel-industry job losses' is Statement 1. 'The government should raise import tariffs on foreign steel to protect American jobs' is Statement 2.", "question": "Which of the following correctly classifies these two statements?", "choices": ["Both are positive statements", "Both are normative statements", "Statement 1 is positive; Statement 2 is normative", "Statement 1 is normative; Statement 2 is positive", "Statement 1 is a prediction; Statement 2 is a theory"], "answer": 2, "explanation": "Statement 1 makes a testable empirical claim about the effect of tariffs on jobs \u2192 positive. Statement 2 uses 'should' \u2014 it expresses a value judgment about what policy ought to be \u2192 normative. Answer: C."}, {"num": 13, "graph": null, "stem": "The Hatfield family can produce 100 lbs of chicken OR 50 lbs of corn. The McCoy family can produce 40 lbs of chicken OR 80 lbs of corn.", "question": "Under which condition do both families benefit from the Hatfields specializing in chicken and the McCoys specializing in corn?", "choices": ["The Hatfields have a comparative advantage in corn and the McCoys in chicken", "The Hatfields have a comparative advantage in chicken and the McCoys in corn", "The Hatfields have an absolute advantage in both goods", "The McCoys have an absolute advantage in both goods", "Both families have equal opportunity costs"], "answer": 1, "explanation": "Hatfields: 1 chicken costs 0.5 corn; 1 corn costs 2 chicken. McCoys: 1 chicken costs 2 corn; 1 corn costs 0.5 chicken. Hatfields have lower OC for chicken \u2192 comparative advantage in chicken. McCoys have lower OC for corn \u2192 comparative advantage in corn. Both gain when each specializes in their comparative advantage. Answer: B."}, {"num": 14, "graph": null, "stem": "More people enroll in graduate school programs during economic recessions when unemployment is high and job opportunities are scarce.", "question": "Which economic concept best explains this behavior?", "choices": ["Absolute advantage \u2014 people have more skills during recessions", "Economic growth \u2014 recessions create new industries requiring advanced degrees", "Opportunity cost \u2014 the forgone wages of attending graduate school fall when job prospects are poor", "Normative economics \u2014 people believe education is valuable", "Comparative advantage \u2014 graduates are more productive than non-graduates"], "answer": 2, "explanation": "The opportunity cost of attending grad school is the income/career opportunity forgone. During a recession, job prospects deteriorate and wages fall, so the opportunity cost of going back to school falls. More people choose to attend when it is relatively less costly. Answer: C."}, {"num": 15, "graph": null, "stem": "A country currently produces at a point inside its production possibilities curve. A new government initiative fully employs all previously idle workers and eliminates production inefficiencies.", "question": "Which of the following best describes the result of this initiative?", "choices": ["The PPC shifts outward, representing economic growth", "The PPC shifts inward because workers cost money to employ", "The country moves from a point inside the PPC to a point on the PPC, without the PPC itself shifting", "The country moves to a point outside the PPC", "The slope of the PPC changes, reflecting new opportunity costs"], "answer": 2, "explanation": "A point inside the PPC represents inefficiency or unemployment. Eliminating waste and employing idle workers moves production to the frontier (the PPC itself) \u2014 more output is produced with existing resources. The PPC curve does not shift; the country simply reaches it. Answer: C."}];
const FR = [{"num": 1, "title": "Free-Response Question 1 \u2014 Comparative Advantage & Trade", "graph": "eq2_fr1_families.png", "context": "The Valdez family and the Chen family both produce apples and jam. The PPCs above show their monthly production possibilities (straight lines). Valdez: max 80 lbs apples OR 40 jars of jam. Chen: max 60 lbs apples OR 90 jars of jam.", "table": [["Family", "Max Apples (lbs)", "Max Jam (jars)"], ["Valdez", "80", "40"], ["Chen", "60", "90"]], "parts": [["a", "Calculate the opportunity cost of one jar of jam for each family. Show your work."], ["b", "Calculate the opportunity cost of one pound of apples for each family. Show your work."], ["c", "Which family has the comparative advantage in apple production? In jam production? Explain using opportunity costs."], ["d", "Explain the conditions under which both families benefit from the Valdezes specializing in apples and the Chens specializing in jam and then trading."], ["e", "Suppose the families agree to trade at a price of 1 jar of jam = 1 lb of apples. Show that both families benefit by comparing what each can 'buy' through trade versus what they could produce themselves."]], "answers": [["a", "Valdez: 1 jar of jam costs 80/40 = 2 lbs of apples. Chen: 1 jar of jam costs 60/90 = 0.67 lbs of apples. Chen has the lower opportunity cost for jam."], ["b", "Valdez: 1 lb of apples costs 40/80 = 0.5 jars of jam. Chen: 1 lb of apples costs 90/60 = 1.5 jars of jam. Valdez has the lower opportunity cost for apples."], ["c", "Valdez has the comparative advantage in apples (OC = 0.5 jam < Chen's 1.5 jam). Chen has the comparative advantage in jam (OC = 0.67 apples < Valdez's 2 apples). Each family should produce the good in which its relative opportunity cost is lower."], ["d", "Both families benefit when each specializes in their comparative advantage \u2014 Valdezes in apples, Chens in jam \u2014 and trade. Specialization increases total combined output. Both can then consume a bundle that lies beyond their individual PPC. The trade price must lie between the two families' opportunity costs: between 0.5 and 2 lbs of apples per jar of jam."], ["e", "Trade price: 1 jar = 1 apple. Valdez specializes \u2192 80 apples. To get 40 jars, gives up 40 apples, keeps 40 apples: consumes (40 apples, 40 jars). Without trade, max was (80 apples, 0 jam) or (0 apples, 40 jam) \u2014 trade lets Valdez consume 40 apples AND 40 jars simultaneously, which is better than any self-sufficient option. Chen specializes \u2192 90 jars. Trades 60 jars for 60 apples: consumes (60 apples, 30 jars). Without trade, max was (60 apples, 0) or (0, 90 jam). With trade, Chen gets 60 apples AND 30 jars \u2014 unattainable alone. Both families are better off."]]}, {"num": 2, "title": "Free-Response Question 2 \u2014 Atlantis PPC Analysis", "graph": "eq2_fr2_atlantis.png", "context": "The island of Atlantis produces only potatoes and fish. The PPC above shows the maximum annual output combinations. The table gives specific output options A through F.", "table": [["Option", "Potatoes (lbs)", "Fish (lbs)"], ["A", "1,000", "0"], ["B", "800", "300"], ["C", "600", "500"], ["D", "400", "600"], ["E", "200", "650"], ["F", "0", "675"]], "parts": [["a", "Can Atlantis produce 500 pounds of fish and 800 pounds of potatoes simultaneously? Explain. Where does this point lie relative to the PPC?"], ["b", "What is the opportunity cost of increasing potato output from 600 to 800 pounds per year? Express your answer in pounds of fish."], ["c", "What is the opportunity cost of increasing potato output from 200 to 400 pounds per year?"], ["d", "Are the opportunity costs in parts (b) and (c) equal? What does this tell us about the shape of the PPC and the nature of resources in Atlantis?"], ["e", "Suppose Atlantis discovers a new fishing technology that allows it to catch more fish with the same resources, but does not improve potato farming. Describe and sketch how the PPC would change."]], "answers": [["a", "No. Point B shows that producing 800 lbs of potatoes allows only 300 lbs of fish \u2014 not 500 lbs. Point C shows 600 lbs of potatoes allows 500 lbs of fish. The combination (800 potatoes, 500 fish) lies OUTSIDE the current PPC and is not attainable with current resources and technology."], ["b", "Moving from C (600 potatoes, 500 fish) to B (800 potatoes, 300 fish): potatoes increase by 200 lbs; fish decrease by 200 lbs. Opportunity cost = 200 lbs of fish forgone."], ["c", "Moving from E (200 potatoes, 650 fish) to D (400 potatoes, 600 fish): potatoes increase by 200 lbs; fish decrease by 50 lbs. Opportunity cost = 50 lbs of fish forgone."], ["d", "No \u2014 the opportunity costs are different (50 vs. 200 lbs of fish). The opportunity cost INCREASES as more potatoes are produced. This means the PPC is bowed outward (concave to the origin), reflecting the law of increasing opportunity costs. Resources are not equally suited for both activities \u2014 as Atlantis devotes more resources to potatoes, it must use resources (like boats and fishermen) that are progressively less well-suited to potato farming, making each additional potato increasingly expensive in terms of fish."], ["e", "The PPC would rotate outward along the fish axis. The maximum amount of fish that can be caught (the y-intercept) would increase, but the maximum potato output (x-intercept) would remain the same. The curve would bow further outward along the fish axis, with each point on the new PPC allowing more fish for any given amount of potatoes."]]}, {"num": 3, "title": "Free-Response Question 3 \u2014 Roma Tribes: Specialization & Innovation", "graph": "eq2_mc_roma.png", "context": "In the ancient country of Roma, the Tivoli and Frivoli tribes produce spaghetti and meatballs. The PPCs are shown above. Tivoli: 30 lbs spaghetti OR 50 lbs meatballs. Frivoli (original): 40 lbs spaghetti OR 30 lbs meatballs. After innovation, the Frivoli can produce 40 lbs spaghetti OR 60 lbs meatballs.", "table": [["Tribe", "Max Spaghetti (lbs)", "Max Meatballs (lbs)"], ["Tivoli", "30", "50"], ["Frivoli (original)", "40", "30"], ["Frivoli (after innovation)", "40", "60"]], "parts": [["a", "Before the innovation, which tribe has the comparative advantage in spaghetti production? In meatball production? Show your calculations."], ["b", "Before the innovation, if the tribes specialize and trade, what should each tribe produce? What is the range of acceptable trade prices for one pound of spaghetti (in pounds of meatballs)?"], ["c", "After the Frivoli's meatball innovation, recalculate opportunity costs. Which tribe now has the comparative advantage in meatball production? Has this changed?"], ["d", "After the innovation, which tribe has the absolute advantage in spaghetti? In meatballs? Explain the difference between absolute and comparative advantage in this context."], ["e", "Does the innovation change which tribe should specialize in spaghetti and which in meatballs? Explain."]], "answers": [["a", "Before innovation: Tivoli OC of 1 spaghetti = 50/30 = 1.67 meatballs. Frivoli OC of 1 spaghetti = 30/40 = 0.75 meatballs. Frivoli has lower OC in spaghetti \u2192 comparative advantage in spaghetti. Tivoli OC of 1 meatball = 30/50 = 0.6 spaghetti. Frivoli OC of 1 meatball = 40/30 = 1.33 spaghetti. Tivoli has lower OC in meatballs \u2192 comparative advantage in meatballs."], ["b", "Tivoli should specialize in meatballs; Frivoli in spaghetti. Trade price for 1 lb spaghetti must be above Frivoli's OC (0.75 meatballs) and below Tivoli's OC (1.67 meatballs). Acceptable range: between 0.75 and 1.67 lbs of meatballs per lb of spaghetti."], ["c", "After innovation: Tivoli OC of 1 meatball = 30/50 = 0.6 spaghetti (unchanged). Frivoli OC of 1 meatball = 40/60 = 0.67 spaghetti. Tivoli still has the lower opportunity cost for meatballs \u2192 Tivoli retains comparative advantage in meatballs. Yes \u2014 the comparative advantage assignment has NOT changed."], ["d", "Absolute advantage \u2014 producing more output with same inputs. Meatballs: Frivoli now produces 60 vs Tivoli's 50 \u2192 Frivoli has absolute advantage in meatballs. Spaghetti: Frivoli produces 40 vs Tivoli's 30 \u2192 Frivoli has absolute advantage in spaghetti too! Frivoli has absolute advantage in BOTH goods. But this does not mean trade is useless \u2014 comparative advantage (relative OC) still differs."], ["e", "No \u2014 the innovation does not change who should specialize in what. Tivoli still has comparative advantage in meatballs (OC=0.6 < 0.67) and Frivoli still has comparative advantage in spaghetti (OC = 0.67 meatballs < Tivoli's 1.67 meatballs). Even though Frivoli improved its meatball output, the relative opportunity costs still favor the same specialization. The gains from trade remain, though the new trade price range shifts."]]}, {"num": 4, "title": "Free-Response Question 4 \u2014 Economic Growth & the PPC", "graph": "eq2_fr4_growth.png", "context": "The graph above shows the original PPC and a new PPC for a country that has experienced economic growth. The country produces capital goods and consumer goods.", "table": null, "parts": [["a", "List and briefly explain THREE factors that could cause the PPC to shift outward as shown in the graph."], ["b", "Suppose the growth is caused by an improvement in technology that affects ONLY capital goods production. Sketch how the PPC would shift differently from the graph shown. Explain the difference."], ["c", "A country currently produces 200 capital goods and 300 consumer goods, which lies inside its PPC. Explain two reasons why a country might produce inside its PPC."], ["d", "Why is the trade-off between capital goods and consumer goods today important for a country's future PPC? Explain the long-run significance."], ["e", "'Countries should always produce at the point that maximizes consumer goods output.' Is this a positive or normative statement? Do you agree or disagree? Explain using economic reasoning."]], "answers": [["a", "Three factors: (1) Increase in resources \u2014 discovering new natural resources, population growth increasing labor supply, or accumulation of capital (more machines/factories). (2) Technological improvement \u2014 innovations that allow more output from the same inputs (e.g., better machinery, new farming methods). (3) Improvement in human capital \u2014 better education, training, or health of the workforce increases labor productivity."], ["b", "If only capital goods production improves, the PPC rotates outward along the capital goods axis only. The maximum capital goods output increases (x-intercept moves right), but maximum consumer goods output (y-intercept) stays the same. This differs from the parallel outward shift shown, which assumes both goods benefit equally from growth."], ["c", "Two reasons for producing inside the PPC: (1) Unemployment \u2014 if workers are without jobs, the economy uses fewer resources than available, producing less than its potential. (2) Inefficiency/misallocation \u2014 resources may be directed to lower-value uses, or production processes may be wasteful. Political instability, poor institutions, or lack of information can cause misallocation."], ["d", "Producing more capital goods today (investing) means fewer consumer goods now, but capital goods increase future productive capacity. A country that sacrifices present consumption to invest in capital (factories, machinery, infrastructure) shifts its future PPC further outward, enabling higher production of ALL goods in the future. This is the fundamental trade-off between present and future consumption \u2014 the basis of economic growth theory."], ["e", "This is a normative statement \u2014 'should always produce' expresses a value judgment, not a testable fact. Disagree: maximizing consumer goods means producing zero capital goods, which would prevent future economic growth. While more consumer goods improve current living standards, neglecting capital investment reduces future productive capacity and future living standards. The optimal point depends on society's values regarding present vs. future consumption \u2014 there is no single 'correct' answer."]]}, {"num": 5, "title": "Free-Response Question 5 \u2014 Opportunity Cost & Policy Analysis", "graph": null, "context": "Use opportunity cost and economic reasoning to answer the following questions about real-world economic decisions and policy.", "table": null, "parts": [["a", "More people in cities hire dog walkers and house cleaners than people in rural areas, even when rural residents have more free time. Use opportunity cost to explain this pattern."], ["b", "The U.S. government spends billions of dollars on public education. Explain why this spending may be justified even from a purely economic perspective \u2014 that is, make a positive economic argument (not a normative one) for public education spending."], ["c", "A senator states: 'Because American workers are the most productive in the world, America should produce all goods domestically and not import anything.' Identify two economic errors in this argument."], ["d", "Convenience stores charge higher prices than supermarkets yet remain profitable because busy urban consumers shop there. Use opportunity cost to explain why these consumers are willing to pay higher prices."], ["e", "Suppose a country devotes 30% of its GDP to military spending and only 5% to education. Using the PPC framework, explain the short-run and long-run implications of this allocation decision."]], "answers": [["a", "Urban residents typically earn higher wages, so their time has a higher opportunity cost. Spending 2 hours walking dogs means forgoing 2 hours of high-paying professional work \u2014 a large cost. Hiring a dog walker at $20/hr is cheaper than the $100+/hr in forgone earnings. Rural residents have lower wages and more flexible time, so the opportunity cost of doing these tasks themselves is much lower. Rational individuals hire others when the opportunity cost of self-service exceeds the market price of hiring."], ["b", "A positive economic argument: education increases human capital \u2014 the skills, knowledge, and productivity of workers. Higher human capital raises labor productivity, which increases output, GDP, and tax revenues. Education also generates positive externalities: better-educated citizens are more innovative, commit fewer crimes (reducing costs), and improve public health decisions. Because private markets under-invest in goods with positive externalities, government provision can improve total economic output \u2014 a positive (empirical) claim about market failure."], ["c", "Two errors: (1) The senator confuses absolute advantage with comparative advantage. Even if the U.S. has absolute advantage in all goods, other countries may have comparative advantage (lower opportunity cost) in some goods. Importing those goods frees U.S. resources for goods where it has comparative advantage, raising total output for both countries. (2) The senator ignores that specialization and trade expand the consumption possibilities beyond the PPC. Refusing to import means forgoing the gains from trade and consuming less overall."], ["d", "Busy urban consumers have high opportunity cost of time. A trip to the supermarket may take 45 minutes; a convenience store visit takes 5 minutes. The 40 minutes saved has high value for a professional earning $50\u2013$100/hour \u2014 worth $33\u2013$67. Paying an extra $5\u2013$10 in higher prices is rational if it saves time worth far more. The premium price at convenience stores represents not just the goods, but the purchase of time \u2014 a scarce resource with high opportunity cost for busy people."], ["e", "Short run: allocating 30% of GDP to military means fewer resources for education, healthcare, infrastructure, and consumer goods \u2014 the opportunity cost of military spending. Citizens experience lower current living standards in non-military sectors. Long run: neglecting education (only 5% of GDP) means slower human capital development. Future workers are less skilled and less productive. This constrains future economic growth \u2014 the future PPC grows more slowly or fails to shift outward as it could. The country may find itself with strong military capacity but a shrinking economic base, unable to sustain high living standards or fund future security needs. The PPC framework illustrates that today's allocation choices directly shape tomorrow's productive capacity."]]}];
const letters = ['A','B','C','D','E'];
let answered = 0, correct = 0;

function buildQuiz() {
  const main = document.getElementById('quizMain');
  main.innerHTML = '';

  // MC section
  const mcDiv = document.createElement('div');
  mcDiv.innerHTML = `<div class="section-div"><h2>Multiple Choice</h2><p>Select the best answer — immediate feedback provided</p></div>`;
  main.appendChild(mcDiv);

  MC.forEach((q, qi) => {
    const card = document.createElement('div');
    card.className = 'q-card'; card.id = `card-${qi}`;

    const hdr = document.createElement('div'); hdr.className = 'q-header';
    hdr.innerHTML = `<span class="q-num">${qi+1}</span><span class="q-badge">Multiple Choice</span><span class="q-status" id="status-${qi}"></span>`;
    card.appendChild(hdr);

    if (q.graph && IMAGES[q.graph]) {
      const gd = document.createElement('div'); gd.className = 'q-graph';
      gd.innerHTML = `<img src="${IMAGES[q.graph]}" alt="graph">`;
      card.appendChild(gd);
    }

    const body = document.createElement('div'); body.className = 'q-body';
    body.innerHTML = (q.stem ? `<p class="q-stem">${q.stem}</p>` : '') +
                     `<p class="q-question">${q.question}</p>`;
    card.appendChild(body);

    const cd = document.createElement('div'); cd.className = 'choices';
    q.choices.forEach((text, ci) => {
      const btn = document.createElement('div');
      btn.className = 'choice'; btn.dataset.qi = qi; btn.dataset.ci = ci;
      btn.innerHTML = `<span class="choice-letter">${letters[ci]}</span><span>${text}</span>`;
      btn.addEventListener('click', () => handleChoice(qi, ci));
      cd.appendChild(btn);
    });
    card.appendChild(cd);

    const exp = document.createElement('div'); exp.className = 'explanation'; exp.id = `exp-${qi}`;
    card.appendChild(exp);
    main.appendChild(card);
  });

  // Results block
  const res = document.createElement('div'); res.id = 'results';
  res.innerHTML = `<h2>Multiple Choice Complete!</h2><div class="score-big" id="finalScore"></div><p id="finalMsg"></p><button class="btn-reset" onclick="resetMC()">Try Again</button>`;
  main.appendChild(res);

  // FR section
  const frDiv = document.createElement('div');
  frDiv.innerHTML = `<div class="section-div" style="margin-top:1rem"><h2>Free Response</h2><p>Show all work &nbsp;·&nbsp; Reveal model answers when ready</p></div>`;
  main.appendChild(frDiv);

  FR.forEach((q, qi) => {
    const card = document.createElement('div'); card.className = 'fr-card';

    const hdr = document.createElement('div'); hdr.className = 'fr-header';
    hdr.innerHTML = `<h3>${q.title}</h3><span class="fr-badge">Free Response</span>`;
    card.appendChild(hdr);

    if (q.graph && IMAGES[q.graph]) {
      const gd = document.createElement('div'); gd.className = 'fr-graph';
      gd.innerHTML = `<img src="${IMAGES[q.graph]}" alt="graph">`;
      card.appendChild(gd);
    }

    const body = document.createElement('div'); body.className = 'fr-body';
    body.innerHTML = `<p class="fr-context">${q.context}</p>`;
    if (q.table) {
      let tbl = '<table class="fr-table"><tr>';
      q.table[0].forEach(h => tbl += `<th>${h}</th>`);
      tbl += '</tr>';
      for (let r = 1; r < q.table.length; r++) {
        tbl += '<tr>';
        q.table[r].forEach(d => tbl += `<td>${d}</td>`);
        tbl += '</tr>';
      }
      tbl += '</table>';
      body.innerHTML += tbl;
    }
    card.appendChild(body);

    const parts = document.createElement('div'); parts.className = 'fr-parts';
    q.parts.forEach(([label, text], pi) => {
      const part = document.createElement('div'); part.className = 'fr-part';
      const ans = q.answers[pi][1];
      part.innerHTML = `
        <div class="fr-part-label">Part (${label})</div>
        <div class="fr-part-q">${text}</div>
        <div class="fr-answer" id="fr-ans-${qi}-${pi}"><strong>Model Answer:</strong> ${ans}</div>
        <button class="show-answer-btn" onclick="toggleAns('fr-ans-${qi}-${pi}',this)">Show Answer</button>`;
      parts.appendChild(part);
    });
    card.appendChild(parts);
    main.appendChild(card);
  });
}

function handleChoice(qi, ci) {
  const card = document.getElementById(`card-${qi}`);
  if (card.classList.contains('answered-correct') || card.classList.contains('answered-wrong')) return;
  const q = MC[qi];
  const allChoices = card.querySelectorAll('.choice');
  allChoices.forEach(c => c.classList.add('disabled'));
  const isCorrect = ci === q.answer;
  if (isCorrect) correct++;
  answered++;
  allChoices[ci].classList.add(isCorrect ? 'correct' : 'wrong');
  if (!isCorrect) allChoices[q.answer].classList.add('reveal-correct');
  card.classList.add(isCorrect ? 'answered-correct' : 'answered-wrong');
  const status = document.getElementById(`status-${qi}`);
  status.textContent = isCorrect ? '✓' : '✗';
  status.style.color = isCorrect ? 'var(--green)' : 'var(--red)';
  const exp = document.getElementById(`exp-${qi}`);
  exp.style.display = 'block';
  if (isCorrect) {
    exp.innerHTML = `<strong>Correct!</strong> ${q.explanation}`;
  } else {
    exp.classList.add('wrong-exp');
    exp.innerHTML = `<strong>Incorrect.</strong> Correct answer: <strong>${letters[q.answer]}</strong>. ${q.explanation}`;
  }
  updateProgress();
  if (answered === MC.length) setTimeout(showResults, 700);
}

function updateProgress() {
  const pct = (answered / MC.length * 100).toFixed(0);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `MC: ${answered} / ${MC.length}`;
  document.getElementById('scorePill').textContent = `Score: ${correct}`;
}

function showResults() {
  const res = document.getElementById('results');
  res.style.display = 'block';
  const pct = Math.round(correct / MC.length * 100);
  document.getElementById('finalScore').textContent = `${correct} / ${MC.length}`;
  const msg = pct >= 90 ? 'Exceptional! You have mastered PPC and trade theory.' :
              pct >= 73 ? 'Great work! Strong command of economic fundamentals.' :
              pct >= 53 ? 'Good effort. Review opportunity cost and comparative advantage.' :
                          'Keep studying — revisit PPC diagrams and trade concepts carefully.';
  document.getElementById('finalMsg').textContent = msg + ` (${pct}%)`;
  res.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function resetMC() {
  answered = 0; correct = 0;
  updateProgress();
  buildQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleAns(id, btn) {
  const el = document.getElementById(id);
  if (el.style.display === 'block') {
    el.style.display = 'none'; btn.textContent = 'Show Answer';
  } else {
    el.style.display = 'block'; btn.textContent = 'Hide Answer';
  }
}

buildQuiz();
</script>
</body>
</html>
